version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: contactcreator
      POSTGRES_PASSWORD: contactcreator
      POSTGRES_DB: contactcreator
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contactcreator -d contactcreator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
